    notes: "Judgement call. Gatsby's createContentDigest(object) is a library one-shot whose algorithm the API fixes: gatsby-core-utils hashes objects with node-object-hash configured alg md5 (and primitives with createHash('md5')). Not a project helper, so annotated at the call. Adjudication: facade checked in the published sources the lockfile pins: gatsby 5.16.1 passes gatsby-core-utils' createContentDigest to plugins, and gatsby-core-utils 4.16.0 hashes an object with node-object-hash configured alg md5 (a primitive with createHash('md5')). Both annotations agreed."
