    object: app/updater/certStore
    notes: "Judgement call: windows.CryptQueryObject with CERT_QUERY_OBJECT_FILE and CERT_QUERY_CONTENT_FLAG_PKCS7_SIGNED_EMBED reads the Authenticode PKCS#7 signature embedded in the installer and returns a certificate store parsed from it: a certificate parse from a file. Grouped with the later x509.ParseCertificate of the signer certificate taken from that store (parses of one certificate are one object). The signature verification itself is WinVerifyTrustEx (line 249), which is not a pool item. Adjudication: lines 275-287 and the object from the first annotation: the call closes on line 287 ('); err != nil {'), and the signer certificate that x509.ParseCertificate parses at 324 comes out of the store this call returns, so the two parses are one certificate object (passed on inside a library's output). The second annotation ended the range at 288 and set no object."
