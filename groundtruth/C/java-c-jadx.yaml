    primitive: signature
    origin: project
    reachable: unknown
    notes: "apksig ApkVerifier.verify() is a one-shot library call that verifies the APK's v1/v2/v3/v3.1 signatures. The algorithm comes from the APK being verified (RSA, ECDSA or DSA with various digests), so no algorithm and no hash are set. The builder on line 174 creates the verifier object and names no algorithm, so it is neither an asset nor an anchor. Reading signer.getCertificate() returns certificates apksig already parsed, and the CertificateManager calls in writeCertificate are project-helper calls (parsing and fingerprints happen in that helper, outside the sample), so neither is an asset here."
