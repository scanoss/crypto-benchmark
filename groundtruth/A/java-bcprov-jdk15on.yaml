    notes: "Judgment call: the asset is generator.generateBytes(...), the call that derives. Argon2BytesGenerator() names no algorithm, and the Argon2Parameters.Builder(ARGON2_id) chain on lines 15-20 is an algorithm specification that computes nothing (guide, not assets), the same way a JCA KeyGenerator takes its algorithm from getInstance and its asset is generateKey(). A second annotator may place the asset on line 21 or on the builder chain. Re-derivation: the second annotation put the asset on new Argon2BytesGenerator() (line 21). Kept on generateBytes: the constructor names no algorithm, and Argon2id is fixed only by the parameters init receives, so the asset is the call that derives, as JCA key generation sits on generateKey()."
