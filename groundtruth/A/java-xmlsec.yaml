    notes: "XMLCipher.RSA_OAEP is the rsa-oaep-mgf1p URI (OAEP with SHA-1). Like a JCA getInstance, the getInstance naming the algorithm is the asset and init/encryptKey are follow-ups (annotation log, Java decisions; engine objects). RSA-OAEP carries no hash (guide). The JCA-style engine object is initialized with this key in the same method (init), so it joins the key's object, like AESGCM(key) in the guide's 'built on a key'."
