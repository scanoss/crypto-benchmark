    notes: "new XMLSignature(element, baseURI) builds the verifier from the signature element the program produced; the call names no algorithm, so RSA from the key and document with no padding or hash (guide, verify calls). checkSignatureValue on line 40 is a follow-up. Re-derivation: the first annotation put the verify on new XMLSignature(sigElement, \"\") (line 39). Changed, with the second annotation, to checkSignatureValue (line 40): the constructor names no algorithm and only reads the element, and checkSignatureValue performs the verification. The second annotation also added a SHA-256 hash asset here for the reference digest that verification recomputes; kept out, since it runs inside this verify call."
