    notes: "XMLCipher.AES_256_GCM is the xmlenc11 aes256-gcm URI, which states the key size. getInstance is the asset; init/getEncryptedData/doFinal are follow-ups. The IV is drawn and kept inside the EncryptedData by the library: not related crypto material. The JCA-style engine object is initialized with this key in the same method (init), so it joins the key's object, like AESGCM(key) in the guide's 'built on a key'."
