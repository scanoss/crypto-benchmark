    origin: project
    reachable: true
    depth: 0
    notes: "addDocument names the reference digest SHA-256; the digest of the canonicalized document is computed at sign and goes into DigestValue, a digest the program passes on. No object: a hash given no key. Enveloped and c14n transforms are not cryptographic. On verification the reference digest is recomputed inside checkSignatureValue, a follow-up, so it is not annotated again. A second annotator may treat addDocument as configuration of the signature asset."
