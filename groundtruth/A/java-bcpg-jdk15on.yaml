    object: PgpEncrypt/encrypted
    notes: "JcePGPDataEncryptorBuilder(AES_256) names AES with a 256-bit key; OpenPGP symmetrically encrypted integrity-protected data (SEIPD v1, setWithIntegrityPacket(true)) runs AES in OpenPGP CFB mode, fixed by the API. Primitive block-cipher, not ae: the integrity packet is a SHA-1 MDC, not an AEAD mode; the MDC hash is internal and not annotated. The asset spans the whole PGPEncryptedDataGenerator(...) call, which holds the builder chain. The session key is generated inside the library, so it is not related crypto material. encryptedGen.open(...) is a follow-up. The session key goes from encryption to decryption inside the message, so the two AES assets are one object, as for a JWE content key (guide, passed on); the id takes the variable that carries it. Re-derivation: the second annotation added the new SecureRandom() passed to this builder as a drbg asset. Kept out: creating a generator draws nothing, and the library draws the session key and prefix from it and keeps them inside the message."
