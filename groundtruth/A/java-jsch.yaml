    notes: "KeyPair.genKeyPair(jsch, KeyPair.RSA, 3072) generates the key pair. Primitive signature: the program adds the key to jsch as an SSH user-authentication identity, which signs (as paramiko's add_server_key key in python-paramiko ssh-transport). The algorithm object has this one asset; the serializations form the separate related-crypto-material object. Re-derivation: the first annotation gave primitive signature, since the key becomes an SSH identity. Changed, with the second annotation: the program never connects, so the key is only stored and loaded, and the guide gives such a key no primitive."
