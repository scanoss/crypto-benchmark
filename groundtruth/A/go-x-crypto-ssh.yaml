    notes: "Re-derivation: the second annotation left the SSH config literals out. Kept: the stdlib re-derivation annotated tls.Config literals as TLS contexts independently, and an SSH config is the same kind of context. An ssh.ServerConfig or ssh.ClientConfig literal is the SSH context the transports are created from, annotated like a tls.Config literal; the conn created from it is a separate protocol asset. AddHostKey on line 29 configures it and is not an asset."
