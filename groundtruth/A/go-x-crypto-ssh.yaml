    notes: "Re-derivation: the second annotation counted signer.Sign as a sign call on a key, since ssh.Signer is the library's private-key type. Kept as a follow-up, by the pycryptodome DSS.new precedent, because this program creates the signer from a key with NewSignerFromKey. ssh.NewSignerFromKey creates a signer object on the key, like pycryptodome DSS.new; its Sign method is a follow-up on that object and is not annotated."
