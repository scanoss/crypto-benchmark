    notes: "new EdDSAPrivateKeySpec(seed, curve) derives the private scalar and public point from the seed: a deterministic key generation. Ed25519 from EdDSANamedCurveTable.ED_25519. new EdDSAPrivateKey(privateSpec) and new EdDSAPublicKey(new EdDSAPublicKeySpec(privateSpec.getA(), curve)) on lines 23-24 wrap values the spec already computed and parse no bytes: not assets. A second annotator may annotate them as key parsing."
  - id: gt-0009
    file: src/main/java/bench/KeyFromSeed.java
    lines: [28, 28]
    asset_type: algorithm
    primitive: signature
    algorithm: Ed25519
    origin: project
    reachable: true
    depth: 0
    object: KeyFromSeed/privateSpec
    notes: "new EdDSAEngine(...) creates the signer; it fixes EdDSA and takes Ed25519 from the key. The MessageDigest.getInstance nested in it is part of this asset (guide: a nested call is part of the enclosing asset unless it is an asset kind of its own), not a separate SHA-512 hash asset. No hash parameter: Ed25519 admits only SHA-512. The digest name comes from curve.getHashAlgorithm(), not a literal. Re-derivation: the second annotation added a SHA-512 hash asset for the MessageDigest.getInstance nested in this EdDSAEngine constructor. Kept out: the digest engine is a parameter of the Ed25519 signer it is nested in (guide, nested calls); it hashes nothing the program passes on, unlike a digest handed to a signer."
