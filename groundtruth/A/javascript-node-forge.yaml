    notes: "Building the certificate is one asset, from createCertificate() to cert.sign(), as a builder chain is (guide, building a certificate). forge builds it in statements, so the range spans them; the SHA-256 RSA signature inside is part of it. Re-derivation: the second annotation put the certificate on line 7 only and added an RSA PKCS1v15 SHA-256 signature asset for cert.sign on line 16. Kept as one asset: the guide counts the whole build, sign included, as one certificate asset, and the range keeps both lines a tool might report."
