    origin: project
    reachable: true
    depth: 0
    notes: "jasypt's default algorithm PBEWithMD5AndDES (PKCS#5 PBES1): PBKDF1 with MD5 derives a DES key, then DES-CBC with PKCS5 padding. The creating call fixes both by default, so two assets with the same lines (two-algorithms rule). encrypt and decrypt are follow-ups on the encryptor object. Salt drawn by the library and kept in the output: no salt asset. DES has one key size, so no key_size."
