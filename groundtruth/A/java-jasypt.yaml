    primitive: kdf
    algorithm: PBKDF2
    origin: project
    reachable: true
    depth: 0
    notes: "PBKDF2 half of PBEWITHHMACSHA512ANDAES_256 (set on line 10); no hash on a KDF (guide, hash). Re-derivation: the second annotation added new RandomIvGenerator() on line 11 as a SHA1PRNG drbg asset. Kept out: creating a generator draws nothing, and the IV it later draws stays inside the library output."
  - id: gt-0004
