    reachable: true
    depth: 0
    notes: "BasicPasswordEncryptor is a StandardStringDigester fixed to MD5, 1000 iterations, 8-byte random salt. Annotated as a password hash (primitive kdf) named by its digest, since the scheme has no other algorithm name; a second annotator may write primitive hash. encryptPassword and checkPassword are follow-ups. Salt kept in the output."
  - id: gt-0002
    file: src/main/java/bench/PbeAes256.java
    lines: [8, 8]
    asset_type: algorithm
    primitive: block-cipher
    algorithm: AES
    parameters:
      key_size: 256
      mode: CBC
      padding: PKCS7
    origin: project
    reachable: true
    depth: 0
    notes: "The asset is the creating call new StandardPBEStringEncryptor(); its algorithm comes from setAlgorithm(\"PBEWITHHMACSHA512ANDAES_256\") on the same object in the same method (as key_size comes from KeyPairGenerator.initialize, annotation log, Java decisions). setAlgorithm, setPassword and setIvGenerator configure the object and are not assets. JCE PBEWithHmacSHA512AndAES_256 is PBES2: PBKDF2-HMAC-SHA512 then AES-256-CBC with PKCS5 padding, so two assets with the same lines. new RandomIvGenerator() only configures how the library draws the IV, which it keeps in the output: not an asset. Salt likewise. A second annotator may place these assets on line 10 instead."
  - id: gt-0003
    file: src/main/java/bench/PbeAes256.java
    lines: [8, 8]
