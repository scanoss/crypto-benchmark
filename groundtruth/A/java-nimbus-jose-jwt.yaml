    origin: project
    reachable: true
    depth: 0
    object: JweDirect/key
    notes: "JCA key generation: algorithm and key size from KeyGenerator.getInstance(\"AES\") and init(256) on the same generator (annotation log, Java decisions; key generation). No mode: an AES KeyGenerator fixes none. Re-derivation: the second annotation put this key generation on KeyGenerator.getInstance(\"AES\") (line 15). Kept on generateKey(), the call that generates the key, as in every Java entry (annotation log, Java decisions)."
  - id: gt-0002
    file: src/main/java/bench/JweDirect.java
    lines: [22, 22]
    asset_type: algorithm
    primitive: ae
    algorithm: AES
    origin: project
    reachable: true
    depth: 0
    object: JweDirect/key
    notes: "DirectEncrypter performs JWE alg dir content encryption with the AES key (A*GCM or A*CBC-HS*), so AES with no mode. Nimbus signer/verifier/encrypter/decrypter objects are built on the key and fix the algorithm family they compute, so their construction is an asset (guide: creating a signer object that names its algorithm or fixes it by default), with no parameters because the construction leaves the concrete JWS/JWE algorithm open. The later sign/verify/encrypt/decrypt call on the JOSE object is a separate asset: it is not a follow-up on the signer object, and it is the call that runs the algorithm the header names. A second annotator may annotate only one of the two."
